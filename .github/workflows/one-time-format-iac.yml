name: One-time IAC HTML formatting

on:
  push:
    branches:
      - fix-iac-provenance-20261029

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-iac-provenance-20261029
      - name: Restore original HTML indentation style
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = """                  Developed Python workflows for multilingual scientific-interview transcription and segmented
        subtitling using the internship's original speech-processing stack, including SpeechRecognition,
        and a semi-automated matcher comparing 67 outreach articles with more than 700 scientific
        publications. After the placement, independently re-engineered the transcription workflow as a
        reusable faster-whisper/CTranslate2 pipeline with hardware-aware CPU/GPU execution, FFmpeg
        preprocessing, bounded fallbacks and CI. Authored the IAC Vía Láctea article <em>Eclipse Solar Parcial de Marzo 2025</em>,"""
          new = """                  Developed Python workflows for multilingual scientific-interview transcription and segmented
                  subtitling using the internship's original speech-processing stack, including SpeechRecognition,
                  and a semi-automated matcher comparing 67 outreach articles with more than 700 scientific
                  publications. After the placement, independently re-engineered the transcription workflow as a
                  reusable faster-whisper/CTranslate2 pipeline with hardware-aware CPU/GPU execution, FFmpeg
                  preprocessing, bounded fallbacks and CI. Authored the IAC Vía Láctea article <em>Eclipse Solar Parcial de Marzo 2025</em>,"""
          if text.count(old) != 1:
              raise SystemExit(f"Expected one formatting block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit formatting and remove this workflow
        run: |
          git rm .github/workflows/one-time-format-iac.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep IAC provenance edit aligned with HTML style"
          git push
