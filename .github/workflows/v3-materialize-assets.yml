name: Materialize V3 portfolio assets

on:
  push:
    branches:
      - portfolio-v3-evidence-nav-20261030
    paths:
      - '.build/**'
      - '.github/workflows/v3-materialize-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V3 branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-v3-evidence-nav-20261030
          fetch-depth: 0

      - name: Reassemble verified English syllabus source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/certifications assets/reports
          cat .build/ifcd104-1.part \
              .build/ifcd104-2.part \
              .build/ifcd104-3.part \
              .build/ifcd104-4.part \
              .build/ifcd104-5.part \
              .build/ifcd104-6.part \
              > /tmp/ifcd104.html
          echo 'b4e1fca597e87740e4439ac2ba54e9571a9d20107790ca39d7b319634e9d556a  /tmp/ifcd104.html' | sha256sum --check --strict

      - name: Render English syllabus PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'weasyprint==68.0'
          weasyprint /tmp/ifcd104.html assets/certifications/IFCD104_AI_Big_Data_Healthcare_English_Syllabus.pdf
          test "$(head -c 4 assets/certifications/IFCD104_AI_Big_Data_Healthcare_English_Syllabus.pdf)" = '%PDF'
          test "$(stat -c%s assets/certifications/IFCD104_AI_Big_Data_Healthcare_English_Syllabus.pdf)" -gt 20000

      - name: Mirror canonical TeachScribe engineering report
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/user-attachments/files/34107666/TeachScribe_On_Device_Multimodal_Retrieval_Public_Engineering_Case_Study_v2.pdf' \
            --output assets/reports/TeachScribe_On_Device_Multimodal_Retrieval_Public_Engineering_Case_Study_v2.pdf
          test "$(head -c 4 assets/reports/TeachScribe_On_Device_Multimodal_Retrieval_Public_Engineering_Case_Study_v2.pdf)" = '%PDF'
          test "$(stat -c%s assets/reports/TeachScribe_On_Device_Multimodal_Retrieval_Public_Engineering_Case_Study_v2.pdf)" -gt 100000

      - name: Commit materialized assets and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          rm -f .github/workflows/v3-materialize-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize V3 portfolio PDFs'
          git push origin HEAD:portfolio-v3-evidence-nav-20261030
